# Experiment N3: Weight Decay Ablation
experiment: N3

data:
  dataset: cifar10
  label_noise: 0.15        # fixed η = 15%
  num_workers: 4

model:
  arch: resnet18
  width_multipliers: [4, 8, 16]

weight_decays: [0.0, 1.0e-4, 5.0e-4, 1.0e-3, 5.0e-3]

training:
  epochs: 500
  batch_size: 128
  optimizer: sgd
  momentum: 0.9
  lr: 0.1
  lr_schedule: cosine
  warmup_epochs: 5

logging:
  results_dir: results/N3
  save_checkpoint: false
