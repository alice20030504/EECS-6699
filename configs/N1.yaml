# Experiment N1: (Width × Noise) 2D Phase Diagram — core contribution
experiment: N1

data:
  dataset: cifar10
  subset_size: 4000        # fixed 4000-sample subset
  num_workers: 4

model:
  arch: resnet18
  width_multipliers: [2, 8, 16, 32, 64]

noise_levels: [0.0, 0.10, 0.20, 0.40]   # η values

training:
  epochs: 4000
  batch_size: 128
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0
  lr: 0.1
  lr_schedule: cosine
  warmup_epochs: 5

# Phase classification thresholds (Test Error Gap = TestErr(η,k) - TestErr(0,k))
phase_thresholds:
  benign_max: 0.02         # Gap < 2%
  tempered_max: 0.10       # 2% <= Gap < 10%
  # catastrophic: Gap >= 10%

logging:
  results_dir: results/N1
  save_checkpoint: false
